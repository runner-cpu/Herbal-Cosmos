name: Catalog quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:data
      - run: git diff --exit-code -- data/ reports/ assets/js/data/food-medicine.generated.js
      - run: npm run validate:catalog
      - run: npm test
      - run: npm run check:inline
      - name: Validate runtime assets
        shell: bash
        run: |
          test -s workers/catalog-search.js
          test -s assets/icons/favicon.svg
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check workers/catalog-search.js
  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium
