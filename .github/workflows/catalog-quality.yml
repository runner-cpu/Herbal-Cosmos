name: Catalog quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:data
      - run: git diff --exit-code -- data/ reports/ assets/js/data
      - run: npm run validate:data
      - run: npm run validate:app
      - run: node scripts/fetch-herb-images.mjs --verify
      - run: npm test
      - run: npm run check:inline
      - name: Validate runtime assets
        shell: bash
        run: |
          test -s workers/catalog-search.js
          test -s assets/icons/favicon.svg
          test -s data/sources/herb-images.json
          test $(find images/herbs/open -type f | wc -l) -ge 400
          find assets/js workers -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find assets/js workers -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:ci
