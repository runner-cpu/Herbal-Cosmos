name: Pages smoke

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the published trace experience
        shell: bash
        run: |
          set -euo pipefail
          site='https://runner-cpu.github.io/Herbal-Cosmos/'
          for attempt in $(seq 1 24); do
            html=$(curl --fail --silent --show-error --location --max-time 20 "${site}?sha=${GITHUB_SHA}" || true)
            main=$(curl --fail --silent --show-error --location --max-time 20 "${site}src/main.js?sha=${GITHUB_SHA}" || true)
            data=$(curl --fail --silent --show-error --location --max-time 20 "${site}src/data/curated/comparisons.json?sha=${GITHUB_SHA}" || true)
            if grep -q '一味之证' <<<"$html" && grep -q '3D SPECIMEN LAB' <<<"$main" && grep -q '相似药材' <<<"$main" && grep -q 'cmp-renshen-dangshen' <<<"$data"; then
              echo "Trace Pages smoke passed on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo 'Published trace experience did not converge in time.' >&2
          exit 1
