<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b141f" />
    <title>本草宇宙 · 页面未找到</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23b54a3a'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='%23f5f0e8' text-anchor='middle'%3E%E6%9C%AC%3C/text%3E%3C/svg%3E" />
    <style>
      :root{--ink:#151718;--muted:#6a6157;--line:#cfc4b7;--cinnabar:#b54a3a;--paper:#f5f0e8}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;align-content:center;gap:22px;padding:10vh 8vw;background:var(--paper);background-image:radial-gradient(circle at 15% 0%,rgba(181,74,58,.07),transparent 34rem),radial-gradient(circle at 90% 18%,rgba(120,147,140,.09),transparent 28rem);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
      .brand{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.18em;text-decoration:none}
      .seal{display:grid;place-items:center;width:34px;height:34px;background:var(--cinnabar);color:var(--paper);font-family:Georgia,serif;font-size:19px;transform:rotate(-4deg)}
      h1{margin:0;font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:clamp(2.6rem,7vw,5rem);line-height:1.02;letter-spacing:-.04em}
      p{max-width:560px;margin:0;color:var(--muted);font-size:15px;line-height:1.9}
      .routes{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
      .routes a{padding:11px 16px;border:1px solid var(--line);background:#fffdf8;color:var(--ink);font-size:13px;text-decoration:none}
      .routes a.primary{border-color:var(--cinnabar);background:var(--cinnabar);color:var(--paper)}
      .routes a:hover,.routes a:focus-visible{border-color:var(--cinnabar);color:var(--cinnabar)}
      .routes a.primary:hover,.routes a.primary:focus-visible{background:#96372d;color:#fff}
      code{padding:2px 5px;background:rgba(21,23,24,.06);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
    </style>
  </head>
  <body>
    <a class="brand" href="./#home"><span class="seal" aria-hidden="true">本</span>HERBAL COSMOS · FIELD ATLAS</a>
    <h1>这一页，<br />没有收进本草宇宙。</h1>
    <p>你要找的地址可能已经改名，或者链接里多了一个字符。站内的六个页面都在同一个入口下，可以从下面任意一条继续。</p>
    <nav class="routes" aria-label="返回站点">
      <a class="primary" href="./#home">回到宇宙首页</a>
      <a href="./#cabinet">百子柜</a>
      <a href="./#planet">粒子星球</a>
      <a href="./#library">资料库</a>
      <a href="./#curation">项目说明</a>
    </nav>
    <p style="font-size:12px">提示：站内页面使用 <code>#home</code>、<code>#trace</code> 这样的哈希路由，直接访问不带 <code>#</code> 的子路径会落到这一页。</p>
  </body>
</html>
